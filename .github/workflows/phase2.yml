name: Phase2 correctness
on: [push, pull_request]
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Exact version: a floating 24 moved to 24.22.1 and its undici failed an internal
          # assert in the migration proof. Raise this on purpose, not by runner update.
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run phase2:build
      # arch:check runs boundaries, layering, rules, OpenAPI, contracts, notification writers,
      # links and the permission/lifecycle/api-type tests; npm test already ran phase2:test:source.
      - run: npm run arch:check
      - run: npx playwright install --with-deps chromium
      - run: npm run phase2:test:notification-ui
      - run: npm run phase2:up
      - run: npm run phase2:test:integration
      - run: npm run phase2:test:notification
      - run: npm run phase2:test:notification-runtime
      - run: npm run phase2:test:clinic
      - run: npm run phase2:test:billing
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: npm run phase2:test:resilience
      - run: npm run phase2:test:migration
      - run: npm run phase2:test:e2e
      - if: always()
        run: docker compose -f deploy/phase2/compose.test.yml stop
  # The root Compose plus the phase 2 overlay behind the frontend's nginx, on its own throwaway project. Separate from
  # `proof` so the slow image builds do not lengthen it; nothing else sends traffic through that nginx.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same exact version as the proof job (see the comment there).
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      # The seed needs backend/dist and the generated Prisma clients.
      - run: npm run phase2:build
      - run: npm run test:docker:ingress
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingress-evidence
          path: test-results/k0
          if-no-files-found: ignore
