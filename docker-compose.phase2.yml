# Explicit strict local mode. Use WITH docker-compose.yml, on fresh storage.
# Historical data requires the P7 cutover runbook, never an empty-service switch.
services:
  postgres:
    ports: !override
      - "127.0.0.1:${CORE_DB_PORT:-5432}:5432"
  api:
    environment:
      PHASE2_RUNTIME_REQUIRED: "1"
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_NAMESPACE: nipopeto.local.v1
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:?Run node tools/docker/prepare-phase2.mjs}
      OBSERVABILITY_TOKEN: ${OBSERVABILITY_TOKEN:?Prepare phase2 configuration}
      BROKER_URL: amqp://notification:${BROKER_PASSWORD:?Prepare phase2 configuration}@rabbitmq:5672
      BROKER_PREFIX: nipopeto.local.v1
      CLINIC_SERVICE_URL: http://clinic-api:5101
      CORE_DIRECTORY_TOKEN: ${CORE_DIRECTORY_TOKEN:?Prepare phase2 configuration}
      CORE_BILLING_EVIDENCE_TOKEN: ${CORE_BILLING_EVIDENCE_TOKEN:?Prepare phase2 configuration}
      CLINIC_BILLING_TOKEN: ${CLINIC_BILLING_TOKEN:?Prepare phase2 configuration}
    depends_on:
      clinic-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  notification-api:
    environment:
      PHASE2_RUNTIME_REQUIRED: "1"
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_NAMESPACE: nipopeto.local.v1
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:?Prepare phase2 configuration}
      OBSERVABILITY_TOKEN: ${OBSERVABILITY_TOKEN:?Prepare phase2 configuration}
      BROKER_URL: amqp://notification:${BROKER_PASSWORD:?Prepare phase2 configuration}@rabbitmq:5672
      BROKER_PREFIX: nipopeto.local.v1
    depends_on:
      redis:
        condition: service_healthy

  notification-worker:
    environment:
      PHASE2_RUNTIME_REQUIRED: "1"
  core-outbox:
    environment:
      PHASE2_RUNTIME_REQUIRED: "1"

  clinic-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nipopeto_clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: ${CLINIC_POSTGRES_PASSWORD:?Prepare phase2 configuration}
    volumes:
      - clinic_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d nipopeto_clinic"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  clinic-migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: clinic-build
    environment:
      DATABASE_URL: postgresql://clinic:${CLINIC_POSTGRES_PASSWORD:?Prepare phase2 configuration}@clinic-postgres:5432/nipopeto_clinic?schema=public
    command: ["npm", "run", "db:deploy", "--workspace", "@nipopeto/clinic"]
    depends_on:
      clinic-postgres:
        condition: service_healthy
    restart: "no"

  clinic-api:
    build: &clinic-build
      context: .
      dockerfile: Dockerfile.backend
      target: clinic-runtime
    environment:
      DATABASE_URL: postgresql://clinic:${CLINIC_POSTGRES_PASSWORD:?Prepare phase2 configuration}@clinic-postgres:5432/nipopeto_clinic?schema=public
      PHASE2_RUNTIME_REQUIRED: "1"
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Prepare phase2 configuration}
      JWT_ISSUER: ${JWT_ISSUER:?Prepare phase2 configuration}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Prepare phase2 configuration}
      JWT_KEY_ID: ${JWT_KEY_ID:?Prepare phase2 configuration}
      CORE_SERVICE_URL: http://api:${PORT:-5000}
      CORE_DIRECTORY_TOKEN: ${CORE_DIRECTORY_TOKEN:?Prepare phase2 configuration}
      CORE_BILLING_EVIDENCE_TOKEN: ${CORE_BILLING_EVIDENCE_TOKEN:?Prepare phase2 configuration}
      CLINIC_BILLING_TOKEN: ${CLINIC_BILLING_TOKEN:?Prepare phase2 configuration}
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_NAMESPACE: nipopeto.local.v1
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:?Prepare phase2 configuration}
      OBSERVABILITY_TOKEN: ${OBSERVABILITY_TOKEN:?Prepare phase2 configuration}
      BROKER_URL: amqp://notification:${BROKER_PASSWORD:?Prepare phase2 configuration}@rabbitmq:5672
      BROKER_PREFIX: nipopeto.local.v1
      PORT: "5101"
      BLOB_ENDPOINT: http://blob:8333
      BLOB_PUBLIC_ENDPOINT: ${BLOB_PUBLIC_ENDPOINT:-http://127.0.0.1:8333}
      BLOB_BUCKET: medical-images
      BLOB_ACCESS_KEY: ${BLOB_ACCESS_KEY:?Prepare phase2 configuration}
      BLOB_SECRET_KEY: ${BLOB_SECRET_KEY:?Prepare phase2 configuration}
    depends_on:
      clinic-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      blob:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5101/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  clinic-worker:
    build: *clinic-build
    environment:
      DATABASE_URL: postgresql://clinic:${CLINIC_POSTGRES_PASSWORD:?Prepare phase2 configuration}@clinic-postgres:5432/nipopeto_clinic?schema=public
      PHASE2_RUNTIME_REQUIRED: "1"
      CORE_SERVICE_URL: http://api:${PORT:-5000}
      CORE_DIRECTORY_TOKEN: ${CORE_DIRECTORY_TOKEN:?Prepare phase2 configuration}
      BROKER_URL: amqp://notification:${BROKER_PASSWORD:?Prepare phase2 configuration}@rabbitmq:5672
      BROKER_PREFIX: nipopeto.local.v1
      BLOB_ENDPOINT: http://blob:8333
      BLOB_PUBLIC_ENDPOINT: ${BLOB_PUBLIC_ENDPOINT:-http://127.0.0.1:8333}
      BLOB_BUCKET: medical-images
      BLOB_ACCESS_KEY: ${BLOB_ACCESS_KEY:?Prepare phase2 configuration}
      BLOB_SECRET_KEY: ${BLOB_SECRET_KEY:?Prepare phase2 configuration}
    command: ["node", "services/clinic/dist/worker.js"]
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  core-billing:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in a private env file}
      PHASE2_RUNTIME_REQUIRED: "1"
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Prepare phase2 configuration}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Prepare phase2 configuration}
      JWT_ISSUER: ${JWT_ISSUER:?Prepare phase2 configuration}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Prepare phase2 configuration}
      JWT_KEY_ID: ${JWT_KEY_ID:?Prepare phase2 configuration}
      CLINIC_SERVICE_URL: http://clinic-api:5101
      CLINIC_BILLING_TOKEN: ${CLINIC_BILLING_TOKEN:?Prepare phase2 configuration}
    command: ["node", "backend/dist/src/phase2/billingWorker.js"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # AQ-09 medical image bucket (S3-compatible). The browser fetches images from
  # BLOB_PUBLIC_ENDPOINT with presigned URLs, so this port is published on loopback.
  blob:
    image: chrislusf/seaweedfs:3.97
    entrypoint: ["/bin/sh", "-c"]
    command:
      # Least privilege: the Clinic identity administers only its own bucket (it creates it
      # through the S3 API on startup); every other bucket answers 403.
      - printf '{"identities":[{"name":"clinic","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin:medical-images","Read:medical-images","Write:medical-images","List:medical-images"]}]}' "$$BLOB_ACCESS_KEY" "$$BLOB_SECRET_KEY" > /tmp/s3.json && exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    environment:
      BLOB_ACCESS_KEY: ${BLOB_ACCESS_KEY:?Prepare phase2 configuration}
      BLOB_SECRET_KEY: ${BLOB_SECRET_KEY:?Prepare phase2 configuration}
    ports:
      - "127.0.0.1:${BLOB_PORT:-8333}:8333"
    volumes:
      - phase2_blob:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - phase2_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  clinic_postgres:
  phase2_redis:
  phase2_blob:
