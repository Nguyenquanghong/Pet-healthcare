services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nipopeto
      POSTGRES_USER: nipopeto
      POSTGRES_PASSWORD: nipopeto
    ports:
      - "5432:5432"
    volumes:
      - nipopeto_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nipopeto -d nipopeto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nipopeto_postgres:
